<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  @import url("https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@500;700&display=swap");
  html,body{margin:0;padding:0;width:1920px;height:1080px;overflow:hidden;background:#0a1a30;}
  .stage{
    width:1920px;height:1080px;position:relative;
    background: radial-gradient(1200px 800px at 60% 40%, #14315a 0%, #0f2544 55%, #0a1a30 100%);
    display:flex;align-items:center;justify-content:center;
  }
  .word{
    position:absolute;
    display:flex;align-items:center;gap:36px;
    font-family:"Instrument Sans",sans-serif;
    font-weight:700;
    font-size:170px;
    color:#ffffff;
    letter-spacing:-2px;
    opacity:0;
    transform:scale(0.82);
  }
  .word .accent{ color:#3686c0; }
  svg{ filter: drop-shadow(0 6px 24px rgba(0,0,0,0.35)); }
</style>
</head>
<body>
<div id="hb" style="position:fixed;top:0;left:0;width:2px;height:2px;opacity:0.02;background:#000;pointer-events:none;"></div>
<div class="stage">
  <div class="word" id="w1">
    <svg width="150" height="150" viewBox="0 0 24 24" fill="none" stroke="#3686c0" stroke-width="1.6"><circle cx="9" cy="7" r="4"/><path d="M2 21v-1a6 6 0 0 1 6-6h2a6 6 0 0 1 6 6v1"/><circle cx="17" cy="8" r="3" opacity="0.65"/><path d="M22 21v-1a5 5 0 0 0-4-4.9" opacity="0.65"/></svg>
    <span>Staff<span class="accent">.</span></span>
  </div>
  <div class="word" id="w2">
    <svg width="150" height="150" viewBox="0 0 24 24" fill="none" stroke="#3686c0" stroke-width="1.6"><path d="M12 22s7-6.5 7-12A7 7 0 0 0 5 10c0 5.5 7 12 7 12Z"/><circle cx="12" cy="10" r="2.6"/></svg>
    <span>Sites<span class="accent">.</span></span>
  </div>
  <div class="word" id="w3">
    <svg width="150" height="150" viewBox="0 0 24 24" fill="none" stroke="#3686c0" stroke-width="1.6"><circle cx="12" cy="12" r="9"/><path d="M12 6.5v11M15.2 9.2c0-1.2-1.4-2.1-3.2-2.1s-3.2.9-3.2 2.3 1.4 1.9 3.2 2.1 3.2 .9 3.2 2.2-1.4 2.2-3.2 2.2-3.2-.9-3.2-2.1"/></svg>
    <span>Money<span class="accent">.</span></span>
  </div>
</div>
<script>
  const els = { w1: document.getElementById("w1"), w2: document.getElementById("w2"), w3: document.getElementById("w3") };
  // Each word: [inStart, holdUntil, outEnd] in ms, driven purely by elapsed time.
  const timeline = {
    w1: [0,   650,  820],
    w2: [700, 1350, 1520],
    w3: [1400, 2500, 2500],
  };
  function ease(t){ return 1 - Math.pow(1 - t, 3); }
  const t0 = performance.now();
  function frame(){
    const t = performance.now() - t0;
    document.getElementById("hb").style.transform = "translateX(" + ((t % 1000) / 100000) + "px)";
    for (const key in timeline){
      const el = els[key];
      const [inStart, holdUntil, outEnd] = timeline[key];
      let opacity = 0, scale = 0.82;
      if (t >= inStart){
        const inDur = 220;
        if (t < inStart + inDur){
          const p = ease((t - inStart)/inDur);
          opacity = p; scale = 0.82 + 0.22*p;
        } else if (t < holdUntil){
          opacity = 1; scale = 1.02 - 0.02*Math.min(1,(t-(inStart+inDur))/300);
        } else if (t < outEnd) {
          const p = (t - holdUntil)/Math.max(1,(outEnd-holdUntil));
          opacity = 1 - p; scale = 1 - 0.06*p;
        } else {
          opacity = (key === "w3") ? 1 : 0;
          scale = 1;
        }
      }
      el.style.opacity = opacity;
      el.style.transform = `scale(${scale})`;
    }
    requestAnimationFrame(frame);
  }
  document.fonts.ready.then(() => { window.__ready = true; requestAnimationFrame(frame); });
</script>
</body>
</html>
