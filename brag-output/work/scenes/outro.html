<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  @import url("https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@700&family=Karla:wght@400;500&display=swap");
  html,body{margin:0;padding:0;width:1920px;height:1080px;overflow:hidden;background:#0a1a30;}
  .stage{
    width:1920px;height:1080px;position:relative;
    background: radial-gradient(1100px 700px at 50% 45%, #14315a 0%, #0f2544 55%, #0a1a30 100%);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;
  }
  .mark{display:flex;align-items:center;gap:22px;opacity:0;transform:scale(0.9);}
  .mark svg{filter:drop-shadow(0 6px 20px rgba(0,0,0,0.35));}
  .word{font-family:"Instrument Sans",sans-serif;font-weight:700;font-size:96px;color:#fff;letter-spacing:-1px;}
  .word .accent{color:#3686c0;}
  .tag{font-family:"Karla",sans-serif;font-weight:500;font-size:34px;color:#cbd5e1;opacity:0;transform:translateY(10px);}
</style>
</head>
<body>
<div id="hb" style="position:fixed;top:0;left:0;width:2px;height:2px;opacity:0.02;background:#000;pointer-events:none;"></div>
<div class="stage">
  <div class="mark" id="mark">
    <svg width="86" height="86" viewBox="0 0 24 24" fill="none" stroke="#3686c0" stroke-width="1.7">
      <path d="M12 2 14.2 8.2 21 9 15.8 13.3 17.4 20 12 16.3 6.6 20 8.2 13.3 3 9 9.8 8.2 12 2Z"/>
    </svg>
    <div class="word">Cord <span class="accent">Cleaning</span></div>
  </div>
  <div class="tag" id="tag">Everything a cleaning business runs on — in one place.</div>
</div>
<script>
  const t0 = performance.now();
  function ease(t){ return 1 - Math.pow(1 - t, 3); }
  function frame(){
    const t = performance.now() - t0;
    document.getElementById("hb").style.transform = "translateX(" + ((t % 1000) / 100000) + "px)";
    const mp = Math.min(1, Math.max(0,(t-100)/420));
    const me = ease(mp);
    document.getElementById("mark").style.opacity = me;
    document.getElementById("mark").style.transform = `scale(${0.9+0.1*me})`;

    const tp = Math.min(1, Math.max(0,(t-500)/380));
    const te = ease(tp);
    document.getElementById("tag").style.opacity = te;
    document.getElementById("tag").style.transform = `translateY(${(1-te)*10}px)`;

    requestAnimationFrame(frame);
  }
  document.fonts.ready.then(()=>{ window.__ready = true; requestAnimationFrame(frame); });
</script>
</body>
</html>
